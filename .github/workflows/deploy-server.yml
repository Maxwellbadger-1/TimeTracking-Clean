name: 'CD - Deploy Server to Oracle Cloud'

# Deploy only when server code changes and tests pass
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: 'Deploy to Oracle Cloud (Production)'
    runs-on: ubuntu-latest
    # Only deploy if tests passed (runs after test.yml)
    needs: []  # Will be auto-skipped if test.yml fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true  # Stop on first error
          script: |
            set -e  # Exit on error

            echo "🚀 Starting deployment..."

            # Check if repository exists, if not clone it
            if [ ! -d "/home/ubuntu/TimeTracking-Clean" ]; then
              echo "📥 Repository not found. Cloning..."
              cd /home/ubuntu
              git clone https://github.com/Maxwellbadger-1/TimeTracking-Clean.git
            fi

            cd /home/ubuntu/TimeTracking-Clean

            # Explicit DATABASE_PATH for every step that touches the production DB.
            #
            # Der Symlink server/database.db -> production.db wurde am 20.08.2026 entfernt
            # (siehe .planning/debug/db-stabilisierung-20260818.md). Ohne dieses Symlink
            # fiele jedes Skript ohne gesetztes DATABASE_PATH auf server/database.db im
            # frischen Checkout zurueck - eine neue, leere Datenbank statt der Produktion.
            export DATABASE_PATH=/home/ubuntu/databases/production.db

            # Backup current database (safety!)
            #
            # Zielt direkt auf die Produktionsdatenbank statt auf den früheren Symlink
            # server/database.db. Der Symlink wurde am 20.08.2026 entfernt: Er verleitete
            # Skripte dazu, dieselbe Datenbank über einen zweiten Pfad zu öffnen — SQLite
            # legt die WAL-Datei neben dem geöffneten Pfad an, wodurch zwei Prozesse mit
            # getrennten WAL/SHM auf eine Datei zugriffen. Ergebnis war eine nicht mehr
            # neustartfähige Produktionsdatenbank (siehe .planning/debug/db-stabilisierung-20260818.md).
            #
            # Backups liegen jetzt einheitlich unter ~/databases/backups/.
            echo "💾 Creating database backup..."
            mkdir -p /home/ubuntu/databases/backups
            cp /home/ubuntu/databases/production.db \
               /home/ubuntu/databases/backups/production.predeploy_$(date +%Y%m%d_%H%M%S).db || true

            # Pull latest code
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # Clean up old files
            echo "🧹 Cleaning up old files..."
            find server -name "*.mjs" -delete 2>/dev/null || true

            # Fix npm corruption by reinstalling npm via npm itself
            echo "🔧 Fixing npm corruption..."
            curl -L https://www.npmjs.com/install.sh | sh 2>/dev/null || true

            # Also try to fix with nvm if available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" 2>/dev/null || true

            # Clean npm cache
            rm -rf ~/.npm 2>/dev/null || true

            # Install dependencies and build
            echo "📦 Installing dependencies..."
            cd server
            rm -rf node_modules package-lock.json 2>/dev/null || true
            npm install --legacy-peer-deps

            echo "🔨 Building TypeScript..."
            npm run build

            # Check if build succeeded
            if [ ! -f "dist/server.js" ]; then
              echo "❌ Build failed! dist/server.js not found"
              exit 1
            fi

            # Run database migrations
            echo "🗄️  Running database migrations..."
            DATABASE_PATH=$DATABASE_PATH NODE_ENV=production npm run migrate:prod || {
              echo "❌ Migration failed! Deployment aborted."
              echo "💡 Database backup available: server/database.backup.*.db"
              exit 1
            }
            echo "✅ Migrations completed successfully"

            # Validate database schema (non-blocking)
            echo "🔍 Validating database schema..."
            DATABASE_PATH=$DATABASE_PATH NODE_ENV=production npm run validate:schema || true
            echo "✅ Schema validation completed"

            # HINWEIS: Der Schritt "Fix overtime calculations" stand frueher an dieser Stelle.
            # Er ist seit Phase 9.1 (D-04) entfallen - Begruendung im Kopfkommentar von
            # server/src/server.ts.
            #
            # An dieser Stelle stand bis Phase 9.1 zusaetzlich ein crontab-Bereinigungsschritt,
            # der einen alten externen Cronjob-Eintrag auf fix-overtime.ts entfernte. Er war eine
            # Einmal-Migration (D-03) und hat seinen Zweck erfuellt: auf beiden Servern existiert
            # kein solcher Eintrag mehr - 09.1-NACHWEIS-PRODUKTION.md:215 und
            # 09.1-NACHWEIS-STAGING.md:165 belegen je "grep -c fix-overtime" = 0; der crontab
            # traegt dort nur noch den woechentlichen sync-prod-to-staging.sh.
            # Er entfaellt ersatzlos statt gehaertet zu werden, weil "crontab -" den GESAMTEN
            # crontab durch stdin ersetzt: scheitert "crontab -l" oder filtert "grep -v" alles
            # weg, installiert der Schritt still einen leeren crontab, ohne dass der ||-Zweig
            # greift. Ein Schritt ohne verbleibenden Nutzen riskiert damit den fremden
            # Sync-Eintrag (Befund CR-01, 09.1-REVIEW.md:75).
            # Hier steht bewusst nichts mehr - kein Deployment fasst den crontab noch an.

            # Create .env file if it doesn't exist
            echo "🔐 Setting up environment..."
            if [ ! -f ".env" ]; then
              echo "Creating new .env file..."
              SESSION_SECRET=$(openssl rand -hex 32)
              echo "SESSION_SECRET=$SESSION_SECRET" > .env
              echo "NODE_ENV=production" >> .env
              echo "TZ=Europe/Berlin" >> .env
              echo "PORT=3000" >> .env
            fi

            # Extract SESSION_SECRET (simple and safe)
            SESSION_SECRET=$(grep "^SESSION_SECRET=" .env | head -1 | cut -d= -f2 || echo "")

            if [ -z "$SESSION_SECRET" ]; then
              echo "⚠️  SESSION_SECRET empty, generating new one..."
              SESSION_SECRET=$(openssl rand -hex 32)
            fi

            echo "✅ Environment ready (SESSION_SECRET length: ${#SESSION_SECRET})"

            # Restart PM2
            echo "🔄 Restarting PM2..."
            pm2 stop timetracking-server || true
            pm2 delete timetracking-server || true

            # Set ALLOWED_ORIGINS for CORS
            export ALLOWED_ORIGINS='tauri://localhost,https://tauri.localhost,http://tauri.localhost,http://localhost:1420'

            TZ=Europe/Berlin NODE_ENV=production DATABASE_PATH=$DATABASE_PATH SESSION_SECRET=$SESSION_SECRET ALLOWED_ORIGINS=$ALLOWED_ORIGINS \
              pm2 start dist/server.js \
              --name timetracking-server \
              --cwd /home/ubuntu/TimeTracking-Clean/server \
              --time \
              --update-env
            pm2 save

            # Wait for server to start
            echo "⏳ Waiting for server to start..."
            sleep 5

            # Health check
            echo "🏥 Running health check..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment successful! Server is healthy"
              pm2 status
            else
              echo "❌ Health check failed! HTTP $HTTP_CODE"
              pm2 logs timetracking-server --lines 50
              exit 1
            fi

            # Ueberstunden-Neuberechnung nach Deployment: seit Phase 9.1 (D-04) entfallen.
            # Der Lauf geschieht jetzt einmalig und nicht blockierend im Serverprozess nach
            # runMigrations(db) — die vollstaendige Begruendung fuer die vormalige Position
            # in diesem Ablauf (nach PM2-Start und Health-Check, wegen der TypeScript-
            # Migrationen ueber user_work_periods) steht im Kopfkommentar von
            # server/src/server.ts.

      - name: Verify DB path post-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Verifying DB path..."
            PM2_PID=$(pm2 pid timetracking-server)
            if [ -z "$PM2_PID" ] || [ "$PM2_PID" = "0" ]; then
              echo "ERROR: PM2 process 'timetracking-server' not found or not running"
              exit 1
            fi
            echo "PM2 PID: $PM2_PID"
            DB_PATH=$(lsof -p "$PM2_PID" | grep '\.db$' | awk '{print $NF}' | head -1)
            EXPECTED="/home/ubuntu/databases/production.db"
            if [ "$DB_PATH" = "$EXPECTED" ]; then
              echo "DB verification PASSED: $DB_PATH"
            else
              echo "DB verification FAILED: expected $EXPECTED, got: $DB_PATH"
              exit 1
            fi

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment to Oracle Cloud successful!"
          echo "🌐 Server URL: http://129.159.8.19:3000"
          echo "📊 Check status: ssh ubuntu@129.159.8.19 'pm2 status'"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs: ssh ubuntu@129.159.8.19 'pm2 logs timetracking-server --lines 100'"
