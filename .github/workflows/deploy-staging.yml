# ============================================================
# STAGING / GREEN SERVER — ON-DEMAND ONLY
# ============================================================
# This workflow deploys to the Green Server (port 3001).
# It is NOT part of the standard 2-Tier development flow.
#
# Trigger: Manual only (workflow_dispatch) or staging branch push.
# The staging branch is not maintained in the 2-Tier workflow.
#
# Standard flow: npm run sync-dev-db -> develop on main -> git push main
# See: scripts/sync-dev-db.sh for local DB setup
# ============================================================
name: 'Deploy to Staging (Green Server)'

# Deploy only when server code changes and tests pass
on:
  push:
    branches: [staging]
    paths:
      - 'server/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: 'Deploy to Staging (Port 3001)'
    runs-on: ubuntu-latest
    # Only deploy if tests passed (runs after test.yml)
    needs: []  # Will be auto-skipped if test.yml fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true  # Stop on first error
          # appleboy/ssh-action bricht ohne diesen Wert nach 10 Minuten mit
          # "Run Command Timeout" ab - das traf den Staging-Lauf 33309624652 am
          # 30.08.2026 mitten im tsc-Build (npm install allein 4 min). Seit CR-03
          # liegen Migration und Schemapruefung zwischen "pm2 stop" und
          # "start_server"; ein Timeout in diesem Fenster liesse den Server
          # gestoppt zurueck. Der lange Build liegt zwar davor, aber das Limit
          # gehoert trotzdem oberhalb der realen Laufzeit statt knapp darunter
          # (letzter gruener Lauf: 5m54s = 59% des Defaults).
          command_timeout: 20m
          script: |
            set -e  # Exit on error

            echo "🚀 Starting deployment..."

            # Check if repository exists, if not clone it
            if [ ! -d "/home/ubuntu/TimeTracking-Green" ]; then
              echo "📥 Repository not found. Cloning..."
              cd /home/ubuntu
              git clone https://github.com/Maxwellbadger-1/TimeTracking-Clean.git TimeTracking-Green
            fi

            cd /home/ubuntu/TimeTracking-Green

            # Backup current database (safety!)
            echo "💾 Creating database backup..."
            cp server/database.db server/database.backup.$(date +%Y%m%d_%H%M%S).db || true

            # Pull latest code from staging branch
            echo "📥 Pulling latest code from GitHub (staging branch)..."
            git fetch origin staging
            git reset --hard origin/staging

            # Clean up old files
            echo "🧹 Cleaning up old files..."
            find server -name "*.mjs" -delete 2>/dev/null || true

            # Fix npm corruption by reinstalling npm via npm itself
            echo "🔧 Fixing npm corruption..."
            curl -L https://www.npmjs.com/install.sh | sh 2>/dev/null || true

            # Also try to fix with nvm if available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" 2>/dev/null || true

            # Clean npm cache
            rm -rf ~/.npm 2>/dev/null || true

            # Install dependencies and build
            echo "📦 Installing dependencies..."
            cd server
            rm -rf node_modules package-lock.json 2>/dev/null || true
            npm install --legacy-peer-deps

            echo "🔨 Building TypeScript..."
            npm run build

            # Check if build succeeded
            if [ ! -f "dist/server.js" ]; then
              echo "❌ Build failed! dist/server.js not found"
              exit 1
            fi

            # Migration und Schemapruefung standen bis CR-03 an dieser Stelle - also noch
            # BEVOR der Serverprozess gestoppt wurde. Sie sind bewusst nach unten hinter
            # "pm2 stop"/"pm2 delete" gewandert; die Begruendung steht dort.

            # Ueberstunden-Neuberechnung nach Deployment: seit Phase 9.1 (D-04) entfallen.
            # Der Lauf geschieht jetzt einmalig und nicht blockierend im Serverprozess nach
            # runMigrations(db) — vollstaendige Begruendung im Kopfkommentar von
            # server/src/server.ts.

            # An dieser Stelle stand bis Phase 9.1 ein crontab-Bereinigungsschritt, der einen
            # alten externen Cronjob-Eintrag auf fix-overtime.ts entfernte. Er war eine
            # Einmal-Migration (D-03) und hat seinen Zweck erfuellt: 09.1-NACHWEIS-PRODUKTION.md:215
            # und 09.1-NACHWEIS-STAGING.md:165 belegen je "grep -c fix-overtime" = 0; der crontab
            # traegt dort nur noch den woechentlichen sync-prod-to-staging.sh.
            # Er entfaellt ersatzlos statt gehaertet zu werden, weil "crontab -" den GESAMTEN
            # crontab durch stdin ersetzt: scheitert "crontab -l" oder filtert "grep -v" alles
            # weg, installiert der Schritt still einen leeren crontab, ohne dass der ||-Zweig
            # greift (Befund CR-01, 09.1-REVIEW.md:75).
            # Hier steht bewusst nichts mehr - kein Deployment fasst den crontab noch an.

            # Create .env file if it doesn't exist
            echo "🔐 Setting up environment..."
            if [ ! -f ".env" ]; then
              echo "Creating new .env file..."
              SESSION_SECRET=$(openssl rand -hex 32)
              echo "SESSION_SECRET=$SESSION_SECRET" > .env
              echo "NODE_ENV=staging" >> .env
              echo "TZ=Europe/Berlin" >> .env
              echo "PORT=3001" >> .env
            fi

            # Extract SESSION_SECRET (simple and safe)
            SESSION_SECRET=$(grep "^SESSION_SECRET=" .env | head -1 | cut -d= -f2 || echo "")

            if [ -z "$SESSION_SECRET" ]; then
              echo "⚠️  SESSION_SECRET empty, generating new one..."
              SESSION_SECRET=$(openssl rand -hex 32)
            fi

            echo "✅ Environment ready (SESSION_SECRET length: ${#SESSION_SECRET})"

            # Set ALLOWED_ORIGINS for CORS (muss gesetzt sein, bevor start_server laeuft)
            export ALLOWED_ORIGINS='tauri://localhost,https://tauri.localhost,http://tauri.localhost,http://localhost:1420'

            # Serverstart als Funktion statt als zwei Kopien: der Aufruf traegt sechs
            # Umgebungsvariablen und vier PM2-Optionen. Zwei Kopien driften auseinander,
            # sobald jemand eine Variable ergaenzt - und vergessen wuerde mit hoher
            # Wahrscheinlichkeit die im Fehlerpfad, weil sie im Normalbetrieb nie laeuft.
            # Die Funktion wird aus zwei Pfaden gerufen: aus dem Fehlerzweig der Migration
            # und aus dem Erfolgspfad. "pm2 save" gehoert mit hinein, damit beide Pfade
            # PM2 in demselben wiederherstellbaren Zustand verlassen.
            # PORT must be passed as prefix — PM2 does NOT load .env files
            # (see ENV.md Green Server Critical Notes for full explanation)
            start_server() {
              TZ=Europe/Berlin NODE_ENV=staging SESSION_SECRET=$SESSION_SECRET ALLOWED_ORIGINS=$ALLOWED_ORIGINS PORT=3001 \
                pm2 start dist/server.js \
                --name timetracking-staging \
                --cwd /home/ubuntu/TimeTracking-Green/server \
                --time \
                --update-env
              pm2 save
            }

            # Server anhalten, BEVOR ein Fremdprozess die Datenbank anfasst (CR-03,
            # .planning/debug/wal-abgehaengt-20260827.md). Ein zweiter Halter auf der Datei
            # ist genau der Mechanismus, der die WAL des laufenden Serverprozesses abhaengt;
            # .claude/CLAUDE.md verbietet ihn einschliesslich readonly.
            echo "🔄 Stopping PM2 before database access..."
            pm2 stop timetracking-staging || true
            pm2 delete timetracking-staging || true

            # Schlaegt die Migration fehl, wird der Server wieder gestartet, damit ein
            # fehlgeschlagenes Deployment keinen Ausfall erzeugt. Gestartet wird dann aber
            # auf einem Code-Stand, dessen Migration NICHT durchlief - deshalb danach
            # "exit 1", damit der Lauf sichtbar rot ist und jemand hinsieht.
            # Schlaegt auch start_server fehl, bleibt es bei "exit 1": "set -e" ist im
            # rechten Zweig eines "||" ausgesetzt, der Ausstiegscode ist deshalb
            # unabhaengig vom Erfolg des Neustarts.
            echo "🗄️  Running database migrations (server stopped)..."
            NODE_ENV=staging npm run migrate:prod || {
              echo "❌ Migration failed! Deployment aborted."
              echo "💡 Database backup available: server/database.backup.*.db"
              start_server
              exit 1
            }
            echo "✅ Migrations completed successfully"

            # An dieser Stelle stand bis 30.08.2026 ein Schema-Validierungsschritt
            # (`npm run validate:schema`). Er ist ersatzlos entfallen: sein Erwartungsschema
            # beschrieb das Datenmodell von vor Februar 2026 und meldete deshalb bei JEDEM
            # Lauf "VALIDATION FAILED" - 9 der 22 Tabellen kannte es gar nicht, bei 12
            # meldete es Abweichungen, nur `users` war gruen. Durch "|| true" wurde der
            # Fehlschlag geschluckt und von der folgenden echo-Zeile mit einem gruenen Haken
            # ueberschrieben: das Deployment-Log zeigte Erfolg, wo die Pruefung fehlschlug.
            # Gegenprobe gegen eine bekannt intakte Sicherung
            # (DB-Backups/production.POST-DATENKORREKTUR_20260818.db) ergab dieselben
            # Meldungen - das Skript war der Defekt, nicht die Datenbank.
            # Den Schutz leistet der blockierende Migrationsschritt darueber (exit 1).

            # Erfolgspfad: Server wieder starten
            echo "🚀 Starting PM2..."
            start_server

            # Wait for server to start
            echo "⏳ Waiting for server to start..."
            sleep 5

            # Health check on PORT 3001 (staging)
            echo "🏥 Running health check..."
            # Der Server braucht auf dieser Maschine rund sieben Sekunden bis "Listening":
            # der Ueberstunden-Neuberechnungslauf beim Start dauert allein ~3,3 s. Ein
            # einzelner Versuch nach "sleep 5" kam am 31.08.2026 (Lauf 33352481708) exakt
            # EINE Sekunde zu frueh (Check 03:06:49, "Listening" 03:06:50) und liess den
            # Deploy rot enden, obwohl er erfolgreich war - derselbe Mechanismus wie am
            # 29.08. (Lauf 33270724872).
            # "|| echo 000" ist nicht optional: ohne es endet curl bei fehlender Verbindung
            # mit Exit 7, und "script_stop: true" bricht das Skript ab, BEVOR die Auswertung
            # unten laeuft - die Fehlerbehandlung darunter waere toter Code.
            # "if ... then break" statt "[ ... ] && break": ein fehlschlagender Test setzt
            # den Exitcode der &&-Liste auf 1, was unter "set -e" die Schleife beenden wuerde.
            HTTP_CODE="000"
            for i in $(seq 1 20); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/api/health || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then break; fi
              sleep 3
            done
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment successful! Server is healthy"
              pm2 status
            else
              echo "❌ Health check failed! HTTP $HTTP_CODE"
              pm2 logs timetracking-staging --lines 50
              exit 1
            fi

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment to Oracle Cloud successful!"
          echo "🌐 Server URL: http://129.159.8.19:3001"
          echo "📊 Check status: ssh ubuntu@129.159.8.19 'pm2 status'"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs: ssh ubuntu@129.159.8.19 'pm2 logs timetracking-staging --lines 100'"
